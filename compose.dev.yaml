# docker-compose -p thewhot-dev -f compose.yaml -f compose.dev.yaml up --build
services:
  medusa:
    build:
      context: ./medusa-backend
      dockerfile: Dockerfile.dev
    environment:
      NODE_ENV: development
      ALLOW_LOCAL_HTTP: 'true'
    volumes:
      - ./medusa-backend:/app
      - medusa_dev_modules:/app/node_modules
      - medusa_dev_build:/app/.medusa
    command: sh -c 'npm ci --no-audit --no-fund && npm run dev -- --host 0.0.0.0'
  storefront:
    build:
      context: ./goods-store
      dockerfile: Dockerfile.dev
    environment:
      NODE_ENV: development
      COOKIE_SECURE: 'false'
    volumes:
      - ./goods-store:/app
      - store_dev_modules:/app/node_modules
      - store_dev_build:/app/.next
    command: sh -c 'npm ci --no-audit --no-fund && npx next dev --hostname 0.0.0.0 --port 8790'
volumes:
  medusa_dev_modules:
  medusa_dev_build:
  store_dev_modules:
  store_dev_build:
