<!doctype html><html lang="ko"><meta charset="utf-8"><title>THE WHOT · Layout Review</title><style>body{margin:20px;font:14px system-ui;background:#eee}button,select{padding:10px}iframe{border:0;background:white;transform-origin:top left}#stage{margin-top:16px;overflow:auto}pre{white-space:pre-wrap;max-height:100px;overflow:auto}#framebox{overflow:hidden}</style><h1>Layout review · 390 / 768 / 1440</h1><select id="route"></select><select id="width"><option>390</option><option>768</option><option>1440</option></select><button id="show">화면 보기</button><button id="scan">전체 레이아웃 검사</button><pre id="result"></pre><div id="stage"><div id="framebox"><iframe id="preview" title="검수 화면"></iframe></div></div><script>
const routes=['/','/#shop','/#brand','/#account','/#cart','/#admin','/brand/BrandStory','/brand/OurProcess','/brand/thewhotBrewery','/brand/Year-Round','/brand/SpecialSeasonal','/brand/Pairing','/brand/OurPartners','/brand/DesignbyUs','/brand/DesignYourOwn','/brand/Promotion','/brand/People','/brand/CONTACT','/brand/Brewmaster','/brand/Journey','/brand/Achievements','/brand/Sustainability','/brand/hansalim'];
const selector=document.querySelector('#route'),width=document.querySelector('#width'),frame=document.querySelector('#preview'),box=document.querySelector('#framebox'),result=document.querySelector('#result');for(const path of routes)selector.add(new Option(path,path));
async function show(path,w){frame.style.width=w+'px';frame.style.height='1600px';const scale=Math.min(1,(innerWidth-50)/w);frame.style.transform=`scale(${scale})`;box.style.height=1600*scale+'px';box.style.width=w*scale+'px';await new Promise(resolve=>{frame.onload=()=>setTimeout(resolve,800);frame.src=path});}
// Hash URLs must put the cache-busting query before the hash.
async function load(path,w){const parts=path.split('#');await show(parts[0]+'?qaPath='+Date.now()+(parts[1]?'#'+parts[1]:''),w)}
document.querySelector('#show').onclick=()=>load(selector.value,Number(width.value));
document.querySelector('#scan').onclick=async()=>{const checks=[];document.querySelector('#scan').disabled=true;try{for(const path of routes)for(const w of [390,768,1440]){await load(path,w);const d=frame.contentDocument;checks.push({path,width:w,overflow:d.documentElement.scrollWidth>w+2,bodyWidth:d.documentElement.scrollWidth,title:d.title,errors:[...d.querySelectorAll('[role="alert"]')].map(e=>e.textContent),brokenLoadedImages:[...d.images].filter(i=>i.complete&&!i.naturalWidth).map(i=>i.getAttribute('src'))});result.textContent=JSON.stringify(checks,null,2)} }finally{document.querySelector('#scan').disabled=false}};
load('/',390);
</script></html>
