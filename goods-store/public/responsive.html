<!doctype html><html lang="ko"><meta charset="utf-8"><title>반응형 검수</title><style>body{margin:0;background:#deded4;font:14px system-ui;color:#163e2c}nav{padding:12px;background:#fff;display:flex;gap:12px;flex-wrap:wrap}a{color:inherit}#wrap{position:relative;margin:15px}iframe{border:0;transform-origin:top left;background:#f8f6ee}#status{padding:12px;font-size:12px}</style><nav><a href="?w=390">390px</a><a href="?w=768">768px</a><a href="?w=1440">1440px</a><a href="?w=390&v=brand">브랜드 390</a><a href="?w=768&v=brand">브랜드 768</a><a href="?w=1440&v=brand">브랜드 1440</a><a href="?w=390&v=shop">상품 390</a><a href="?w=390&v=admin">관리자 390</a></nav><div id="status">로딩 중</div><div id="wrap"><iframe id="frame" title="반응형 검수 화면"></iframe></div><script>const q=new URLSearchParams(location.search),w=Number(q.get('w'))||1440,v=q.get('v')||'home',f=document.getElementById('frame');let scale=Math.min(1,(innerWidth-30)/w);f.style.width=w+'px';f.style.height='2400px';f.style.transform=`scale(${scale})`;document.getElementById('wrap').style.height=2400*scale+'px';f.src='/#'+v;function check(){const d=f.contentDocument;if(!d)return;document.getElementById('status').textContent=`${w}px / ${v} / scrollWidth ${d.documentElement.scrollWidth}px / clientWidth ${d.documentElement.clientWidth}px / 가로 넘침 ${d.documentElement.scrollWidth>d.documentElement.clientWidth?'있음':'없음'}`;}f.addEventListener('load',()=>{check();setTimeout(check,1800)});</script></html>
